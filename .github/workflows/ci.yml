# Pull-request and main-branch gates. @pletopay/node is bundled into the build and is not on npm
# yet, so the sibling repo is checked out and built first. The live suite (pnpm test:live) needs a
# running API and is not run here.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: pletopay-mcp
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: pletopay/pletopay-sdk-node
          path: pletopay-sdk-node
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: pletopay-mcp/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Build the Node SDK
        run: pnpm --dir pletopay-sdk-node install --frozen-lockfile && pnpm --dir pletopay-sdk-node build
      - name: Install
        run: pnpm --dir pletopay-mcp install --frozen-lockfile
      - name: Verify
        run: pnpm --dir pletopay-mcp verify

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: pletopay-mcp
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: pletopay/pletopay-sdk-node
          path: pletopay-sdk-node
      - name: Build
        run: docker build -f pletopay-mcp/Dockerfile -t pletopay-mcp:ci .
      - name: Smoke test
        run: |
          docker run -d --name mcp -p 127.0.0.1:3010:3010 -e MCP_ALLOWED_HOSTS=localhost,127.0.0.1 pletopay-mcp:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3010/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' http://127.0.0.1:3010/mcp)" = 401

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: pletopay-mcp
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: pletopay/pletopay-sdk-node
          path: pletopay-sdk-node
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: pletopay-mcp/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: pnpm --dir pletopay-mcp install --frozen-lockfile
      - run: pnpm --dir pletopay-mcp audit --audit-level=high
