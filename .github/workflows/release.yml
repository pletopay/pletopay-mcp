# Publishes to npm (with provenance) when a vX.Y.Z tag is pushed. Needs the NPM_TOKEN secret
# (an automation token for the @pletopay scope). @pletopay/node is bundled into the build, so the
# sibling repo is checked out and built first.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: pletopay-mcp
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: pletopay/pletopay-sdk-node
          path: pletopay-sdk-node
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: pletopay-mcp/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          # No dependency cache in the publish job: a poisoned cache entry could end up in the
          # published package (zizmor cache-poisoning). CI keeps caching; this job is rare.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Build the Node SDK
        run: pnpm --dir pletopay-sdk-node install --frozen-lockfile && pnpm --dir pletopay-sdk-node build
      - run: pnpm --dir pletopay-mcp install --frozen-lockfile
      - name: Check the tag matches package.json
        working-directory: pletopay-mcp
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: pnpm --dir pletopay-mcp verify
      - name: Publish
        working-directory: pletopay-mcp
        run: pnpm publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
